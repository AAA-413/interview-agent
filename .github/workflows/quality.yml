name: Quality

on:
  # 长期分支 + 约定前缀显式列出（PR6：不再用 "**" 通配，避免「哪些分支会跑 CI」
  # 变成一个需要靠猜的问题；新增长期分支时同步改这里，contract test 会守住它）
  push:
    branches:
      - main
      - develop
      - mac_dev
      - "feat/**"
      - "fix/**"
      - "chore/**"
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend Quality
    runs-on: ubuntu-latest

    env:
      JWT_SECRET_KEY: test-secret
      # deterministic eval 不需要真实 embedding key（release gate 全部 fake / stub）
      AI_BAILIAN_API_KEY: dummy-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          grep -v '^unstructured' requirements.txt > /tmp/requirements-ci.txt
          .venv/bin/python -m pip install -r /tmp/requirements-ci.txt pytest pytest-asyncio ruff

      - name: Compile Python
        run: .venv/bin/python -m compileall -q app scripts tests

      - name: Ruff check
        run: .venv/bin/ruff check .

      - name: Ruff format check
        run: .venv/bin/ruff format --check .

      - name: Pytest
        run: .venv/bin/pytest -q

      - name: Interview Release Gate
        run: PYTHONPATH=. .venv/bin/python scripts/interview_release_gate.py

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build
